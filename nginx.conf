# chunkybacon site + same-origin proxy to rubygems.org so the in-browser
# gem installer needs no CORS. Responses are cached on disk (gems are
# immutable; API index responses expire after a day).
proxy_cache_path /var/cache/nginx/rubygems levels=1:2 keys_zone=rubygems:10m
                 max_size=2g inactive=60d use_temp_path=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /rubygems/ {
        # resolve at request time via Docker's DNS so nginx starts even if
        # rubygems.org is briefly unresolvable
        resolver 127.0.0.11 ipv6=off valid=300s;
        set $rubygems_upstream "https://rubygems.org";
        rewrite ^/rubygems/(.*)$ /$1 break;
        proxy_pass $rubygems_upstream;
        proxy_set_header Host rubygems.org;
        proxy_ssl_server_name on;
        proxy_ssl_name rubygems.org;

        proxy_cache rubygems;
        proxy_cache_valid 200 60d;
        proxy_cache_valid 404 1h;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status;
    }
}
