# chunkybacon site + same-origin bridges to rubygems.org and ruby-lang.org
# for the in-browser gem installer and the HTTP lesson (no CORS needed).
#
# Safety properties: these are NOT open proxies - upstream hosts are
# hardcoded, only the path is forwarded, methods are restricted, requests
# are rate-limited per client IP, and responses are cached on disk (gems
# are immutable; pages expire). Never make the upstream host variable and
# never allowlist an upstream that serves untrusted HTML.
proxy_cache_path /var/cache/nginx/rubygems levels=1:2 keys_zone=rubygems:10m
                 max_size=2g inactive=60d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=proxylimit:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # same-origin bridge to the Ruby homepage for the HTTP lesson (GET only)
    location /proxy/ruby-lang/ {
        limit_req zone=proxylimit burst=20 nodelay;
        limit_except GET HEAD { deny all; }

        resolver 127.0.0.11 ipv6=off valid=300s;
        set $rubylang_upstream "https://www.ruby-lang.org";
        rewrite ^/proxy/ruby-lang/(.*)$ /$1 break;
        proxy_pass $rubylang_upstream;
        proxy_set_header Host www.ruby-lang.org;
        proxy_ssl_server_name on;
        proxy_ssl_name www.ruby-lang.org;

        proxy_cache rubygems;
        proxy_cache_valid 200 6h;
        proxy_cache_valid any 10m;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # rubygems bridge: only the two path shapes the gem installer uses
    # (gem metadata and .gem downloads); everything else on the host 403s.
    location /rubygems/api/v1/gems/ {
        limit_req zone=proxylimit burst=20 nodelay;
        limit_except GET HEAD { deny all; }

        resolver 127.0.0.11 ipv6=off valid=300s;
        set $rubygems_upstream "https://rubygems.org";
        rewrite ^/rubygems/(.*)$ /$1 break;
        proxy_pass $rubygems_upstream;
        proxy_set_header Host rubygems.org;
        proxy_ssl_server_name on;
        proxy_ssl_name rubygems.org;

        proxy_cache rubygems;
        proxy_cache_valid 200 1d;
        proxy_cache_valid 404 1h;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location /rubygems/gems/ {
        limit_req zone=proxylimit burst=20 nodelay;
        limit_except GET HEAD { deny all; }

        resolver 127.0.0.11 ipv6=off valid=300s;
        set $rubygems_upstream "https://rubygems.org";
        rewrite ^/rubygems/(.*)$ /$1 break;
        proxy_pass $rubygems_upstream;
        proxy_set_header Host rubygems.org;
        proxy_ssl_server_name on;
        proxy_ssl_name rubygems.org;

        proxy_cache rubygems;
        proxy_cache_valid 200 60d;
        proxy_cache_valid 404 1h;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location /rubygems/ {
        return 403;
    }
}
