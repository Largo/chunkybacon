<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Chunky Bacon fox — original character by Andi Idogawa & Claude for this
       course. Loose hand-drawn cartoon style; not derived from any existing
       artwork. License: CC BY-NC-SA 4.0 (course assets). -->
  <g stroke="#1a1208" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="rotate(-3 100 100)">
    <!-- bushy tail -->
    <path d="M138 148 q34 6 40 -22 q4 -19 -12 -28 q6 14 -4 22 q2 -14 -12 -18 q8 20 -14 30 z" fill="#fff"/>
    <!-- body -->
    <path d="M72 108 q-6 44 4 58 q1 4 6 4 l42 -1 q5 0 5 -5 q7 -34 1 -57 z" fill="#fff"/>
    <!-- left arm (raised fist with bacon) -->
    <path d="M78 112 q-16 -6 -22 -22 q-3 -8 2 -10 q5 -2 8 5 q6 13 17 16" fill="#fff"/>
    <!-- bacon strip in the raised paw -->
    <g stroke-width="2.4">
      <path d="M38 66 q8 -7 16 0 q8 7 16 0 l-2 13 q-8 6 -15 0 q-7 -6 -16 0 z" fill="#c14a2e"/>
      <path d="M40 72 q8 -7 15 0 q7 6 14 0" stroke="#f5c9a8" fill="none"/>
    </g>
    <!-- right arm (down, excited) -->
    <path d="M124 112 q14 4 18 18 q2 7 -3 9 q-5 1 -7 -6 q-4 -11 -12 -13" fill="#fff"/>
    <!-- head: rounded with cheek fluff -->
    <path d="M64 62 q-4 -26 8 -38 l10 14 q8 -6 18 -6 q10 0 18 6 l10 -14 q12 12 8 38 q13 2 8 10 q-4 6 -14 10 q-4 18 -30 18 q-26 0 -30 -18 q-10 -4 -14 -10 q-5 -8 8 -10 z" fill="#fff"/>
    <!-- inner ears -->
    <path d="M75 34 l5 10 M125 34 l-5 10" stroke-width="2.4"/>
    <!-- eyes: happy shut arcs -->
    <path d="M82 62 q5 -6 10 0 M108 62 q5 -6 10 0" stroke-width="3"/>
    <!-- snout + nose -->
    <path d="M97 70 q3 -2 6 0 l-3 4 z" fill="#1a1208" stroke-width="2"/>
    <!-- big open shouting mouth -->
    <path d="M83 78 q17 -6 34 0 q-3 18 -17 18 q-14 0 -17 -18 z" fill="#1a1208" stroke-width="2.6"/>
    <path d="M92 92 q8 6 16 0 q-3 5 -8 5 q-5 0 -8 -5 z" fill="#e8722a" stroke="none"/>
    <!-- whisker cheeks -->
    <path d="M60 74 l-8 -2 M60 80 l-8 2 M140 74 l8 -2 M140 80 l8 2" stroke-width="2.2"/>
    <!-- shout lines -->
    <path d="M146 44 l10 -8 M150 54 l12 -3 M142 36 l6 -11" stroke-width="2.6"/>
    <!-- legs -->
    <path d="M84 170 l0 8 M114 170 l0 8" stroke-width="3.2"/>
  </g>
</svg>
