<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Chunky Bacon fox mascot, original art (inspired by the spirit of why's foxes) -->
  <g>
    <!-- ears -->
    <polygon points="40,70 55,15 85,60" fill="#e8722a"/>
    <polygon points="160,70 145,15 115,60" fill="#e8722a"/>
    <polygon points="50,62 58,32 74,58" fill="#5a2d0c"/>
    <polygon points="150,62 142,32 126,58" fill="#5a2d0c"/>
    <!-- head -->
    <ellipse cx="100" cy="105" rx="70" ry="60" fill="#f08a3c"/>
    <!-- cheeks / snout base -->
    <ellipse cx="70" cy="125" rx="32" ry="28" fill="#fff4e6"/>
    <ellipse cx="130" cy="125" rx="32" ry="28" fill="#fff4e6"/>
    <!-- eyes -->
    <circle cx="72" cy="95" r="9" fill="#2b1608"/>
    <circle cx="128" cy="95" r="9" fill="#2b1608"/>
    <circle cx="75" cy="92" r="3" fill="#ffffff"/>
    <circle cx="131" cy="92" r="3" fill="#ffffff"/>
    <!-- nose -->
    <ellipse cx="100" cy="122" rx="10" ry="7" fill="#2b1608"/>
    <!-- mouth -->
    <path d="M100 129 Q100 142 86 144 M100 129 Q100 142 114 144" stroke="#2b1608" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- bacon strip held up -->
    <g transform="rotate(-18 160 165)">
      <path d="M120 160 q10 -8 20 0 q10 8 20 0 q10 -8 20 0 q10 8 20 0 l0 16 q-10 8 -20 0 q-10 -8 -20 0 q-10 8 -20 0 q-10 -8 -20 0 z" fill="#c14a2e"/>
      <path d="M120 166 q10 -8 20 0 q10 8 20 0 q10 -8 20 0 q10 8 20 0" stroke="#f5c9a8" stroke-width="4" fill="none"/>
    </g>
  </g>
</svg>
