<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="Atkinson Hyperlegible, Verdana, sans-serif" font-size="14">
  <!-- prremote 0.4.2's protocol over USB serial (lesson pico-deploy):
       README "How It Works", runtime/src/runtime.c. Our own drawing.
       Goes to html/assets/pico/prremote-sequence.svg. -->
  <title>prremote: computer and board over USB serial</title>
  <defs>
    <marker id="to" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1e2229"/>
    </marker>
    <marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#bd2d00"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fbf7ee"/>

  <!-- the two sides -->
  <rect x="30" y="16" width="200" height="50" rx="10" fill="#1e2229"/>
  <text x="130" y="38" fill="#fff" text-anchor="middle" font-weight="bold">computer</text>
  <text x="130" y="56" fill="#fff" text-anchor="middle" font-size="12">gem prremote, mrbc 4.x</text>
  <rect x="410" y="16" width="200" height="50" rx="10" fill="#2f6f4f"/>
  <text x="510" y="38" fill="#fff" text-anchor="middle" font-weight="bold">board (Pico W)</text>
  <text x="510" y="56" fill="#fff" text-anchor="middle" font-size="12">mruby/c runtime firmware</text>
  <line x1="130" y1="66" x2="130" y2="456" stroke="#1e2229" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="510" y1="66" x2="510" y2="456" stroke="#2f6f4f" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- 1: Ctrl-C until READY -->
  <rect x="96" y="78" width="448" height="88" rx="6" fill="none" stroke="#c9a227" stroke-width="1.5"/>
  <text x="140" y="94" font-size="12" fill="#7a5f00">loop: every 1 s until READY</text>
  <line x1="130" y1="118" x2="508" y2="118" stroke="#1e2229" stroke-width="2" marker-end="url(#to)"/>
  <text x="320" y="112" text-anchor="middle">0x03 (Ctrl-C)</text>
  <line x1="510" y1="148" x2="132" y2="148" stroke="#bd2d00" stroke-width="2" marker-end="url(#back)"/>
  <text x="320" y="142" text-anchor="middle" fill="#bd2d00" font-family="monospace" font-size="13">READY prremote-runtime/0.4.2 board=picow</text>

  <!-- 2: run -->
  <text x="140" y="190" font-size="12" fill="#555">prremote run / watch / eval</text>
  <line x1="130" y1="214" x2="508" y2="214" stroke="#1e2229" stroke-width="2" marker-end="url(#to)"/>
  <text x="320" y="208" text-anchor="middle"><tspan font-family="monospace">RITE…</tspan> bytecode, 256-byte pieces</text>
  <line x1="510" y1="248" x2="132" y2="248" stroke="#bd2d00" stroke-width="2" marker-end="url(#back)"/>
  <text x="320" y="242" text-anchor="middle" fill="#bd2d00" font-family="monospace">RUNNING</text>
  <line x1="510" y1="280" x2="132" y2="280" stroke="#bd2d00" stroke-width="2" marker-end="url(#back)"/>
  <text x="320" y="274" text-anchor="middle" fill="#bd2d00">what the program prints</text>
  <line x1="510" y1="312" x2="132" y2="312" stroke="#bd2d00" stroke-width="2" marker-end="url(#back)"/>
  <text x="320" y="306" text-anchor="middle" fill="#bd2d00"><tspan font-family="monospace">DONE</tspan>  or  <tspan font-family="monospace">ERROR &lt;reason&gt;</tspan></text>

  <!-- 3: deploy -->
  <rect x="96" y="336" width="448" height="110" rx="6" fill="none" stroke="#c9a227" stroke-width="1.5"/>
  <text x="140" y="352" font-size="12" fill="#7a5f00">prremote deploy: kept in flash, runs at every boot</text>
  <line x1="130" y1="382" x2="508" y2="382" stroke="#1e2229" stroke-width="2" marker-end="url(#to)"/>
  <text x="320" y="376" text-anchor="middle"><tspan font-family="monospace">DPLY</tspan> + <tspan font-family="monospace">RITE…</tspan> bytecode</text>
  <line x1="510" y1="422" x2="132" y2="422" stroke="#bd2d00" stroke-width="2" marker-end="url(#back)"/>
  <text x="320" y="416" text-anchor="middle" fill="#bd2d00" font-family="monospace">DEPLOYED</text>
</svg>
