<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruby lernen mit Chunky Bacon</title>
    <link rel="stylesheet" href="assets/app.css">
    <script src="browser.script.iife.js"></script>
    <meta name="description" property="og:description" content="Lerne die Programmiersprache Ruby direkt im Browser – auf Deutsch, mit Chunky Bacon. Ein interaktives Notizbuch mit Ruby.wasm, kein Setup nötig.">
    <meta name="author" content="Andi Idogawa">
    <meta name="image" property="og:image" content="assets/chunky.svg">
    <link rel="stylesheet" href="assets/codemirror.css">
    <script src="assets/codemirror.js"></script>
    <script src="assets/codemirror-ruby.js"></script>
    <script src="lessons.js"></script>
    <!-- three.js is vendored locally and only fetched when the 3D lesson
         needs it (see window.ensureThree below); the import map lets the
         addon files resolve their "three" import to the same copy. -->
    <script type="importmap">
      {
        "imports": {
          "three": "./assets/three/three.module.min.js",
          "three/addons/": "./assets/three/"
        }
      }
    </script>
    <link rel="icon" href="assets/chunky.svg">
</head>
<body>

    <div class="spinner" id="spinner">
      <img class="spinner-image" src="assets/chunky.svg" alt="Chunky Bacon Fuchs">
      <h1 id="spinnerTitle">Ruby lernen mit Chunky Bacon</h1>
      <p id="spinnerText">Ruby wird geladen … / Loading Ruby … (einmalig / one-time, ~32&nbsp;MB)</p>
    </div>

    <div id="app" style="display:none">
      <header>
        <img id="mascot" src="assets/chunky.svg" alt="Chunky Bacon Fuchs">
        <div class="headerText">
          <h1 id="siteTitle">Ruby lernen mit Chunky Bacon</h1>
          <p id="siteSubtitle"></p>
        </div>
        <select id="langSelect" title="Sprache / Language">
          <option value="de">Deutsch</option>
          <option value="en">English</option>
        </select>
      </header>

      <div class="layout">
        <div class="sidebar">
          <nav id="lessonNav"></nav>
          <div id="gemsPanel">
            <h3 id="gemsTitle"></h3>
            <div id="gemsList"></div>
            <div class="gemsInstallRow">
              <input id="gemNameInput" type="text" placeholder="gem">
              <button id="gemInstallBtn" type="button"></button>
            </div>
            <p id="gemsNote"></p>
          </div>
        </div>

        <main>
          <article id="lessonBody"></article>

          <div id="chunkyChat">
            <div class="chat-avatar"><img src="assets/chunky.svg" alt="Chunky"></div>
            <div class="chat-message"><p id="chunkyText"></p></div>
          </div>

          <div class="buttons">
            <button id="reset-code" type="button" class="reset"></button>
          </div>
        </main>
      </div>

      <footer>
        <p id="footerCredit"></p>
        <p><small id="footerLicense"></small></p>
      </footer>
    </div>

  <script>
    // Synchronous fetch helpers for the in-browser gem installer (main.rb).
    // Sync XHR blocks the main thread, which is fine here: installs are
    // user-triggered and cached gems resolve in milliseconds.
    window.fetchTextSync = function (url) {
      try {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", url, false);
        xhr.send(null);
        if (xhr.status !== 200) return "ERROR " + xhr.status;
        return xhr.responseText;
      } catch (e) { return "ERROR " + e; }
    };
    window.fetchBinaryBase64 = function (url) {
      try {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", url, false);
        // classic binary-over-sync-XHR trick: raw bytes survive in the
        // low byte of each char with this charset override
        xhr.overrideMimeType("text/plain; charset=x-user-defined");
        xhr.send(null);
        if (xhr.status !== 200) return "ERROR " + xhr.status;
        var text = xhr.responseText;
        var bytes = new Uint8Array(text.length);
        for (var i = 0; i < text.length; i++) bytes[i] = text.charCodeAt(i) & 0xff;
        var chunks = [];
        for (var j = 0; j < bytes.length; j += 0x8000) {
          chunks.push(String.fromCharCode.apply(null, bytes.subarray(j, j + 0x8000)));
        }
        return btoa(chunks.join(""));
      } catch (e) { return "ERROR " + e; }
    };

    // Full HTTP fetch (status + content type + body) for the Net::HTTP
    // shim. Returns a JSON string so only one value crosses the bridge.
    window.fetchHttpSync = function (url) {
      try {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", url, false);
        xhr.send(null);
        return JSON.stringify({
          status: xhr.status,
          contentType: xhr.getResponseHeader("Content-Type") || "",
          body: xhr.responseText
        });
      } catch (e) {
        return JSON.stringify({ status: 0, contentType: "", body: String(e) });
      }
    };

    // Lazy three.js loader for the 3D lesson. three-rb (Ruby) builds the
    // scene graph and delegates the actual WebGL work to three.js, which it
    // looks up as globalThis.THREE - so the module has to be imported and
    // published before any Three::Renderers::ThreeJSRenderer is created.
    // ~750 KB, so we only pay for it on the lesson that asks (main.rb calls
    // ensureThree when that lesson is opened) and Ruby checks threeReady
    // before mounting a canvas.
    window.threeReady = false;
    window.threeLoading = null;
    window.ensureThree = function () {
      if (window.threeLoading) return window.threeLoading;
      window.threeLoading = (async function () {
        var three = await import("./assets/three/three.module.min.js");
        globalThis.THREE = three;
        var orbit = await import("./assets/three/OrbitControls.js");
        globalThis.THREE_ORBIT_CONTROLS = orbit.OrbitControls;
        window.threeReady = true;
        return true;
      })().catch(function (e) {
        window.threeLoading = null;
        console.error("three.js failed to load", e);
        return false;
      });
      return window.threeLoading;
    };

    // Per-cell CodeMirror helpers called from Ruby (main.rb)
    window.cellEditors = {};
    window.initCell = function (idx) {
      var ta = document.getElementById("cell-code-" + idx);
      if (!ta) return;
      window.cellEditors[idx] = CodeMirror.fromTextArea(ta, {
        lineNumbers: true,
        mode: "text/x-ruby",
        matchBrackets: true,
        indentUnit: 2,
        viewportMargin: Infinity,
        extraKeys: {
          "Shift-Enter": function () {
            var btn = document.querySelector('.run-cell[data-idx="' + idx + '"]');
            if (btn) btn.click();
          }
        }
      });
    };
    window.getCellCode = function (idx) {
      return window.cellEditors[idx] ? window.cellEditors[idx].getValue() : "";
    };
    window.setCellCode = function (idx, code) {
      if (window.cellEditors[idx]) window.cellEditors[idx].setValue(code);
    };
    window.refreshAllCells = function () {
      Object.values(window.cellEditors).forEach(function (ed) { ed.refresh(); });
    };
    window.clearCellMarks = function (idx) {
      var ed = window.cellEditors[idx];
      if (ed) ed.getAllMarks().forEach(function (m) { m.clear(); });
    };
    window.markCellLine = function (idx, lineNo) {
      var ed = window.cellEditors[idx];
      if (!ed) return;
      var line = ed.getLine(lineNo - 1) || "";
      var start = Math.max(line.search(/\S/), 0);
      ed.markText(
        { line: lineNo - 1, ch: start },
        { line: lineNo - 1, ch: line.length },
        { className: "marker" }
      );
      ed.scrollIntoView({ line: lineNo - 1, ch: 0 }, 200);
    };
  </script>
  <script type="text/ruby" src="main.rb" data-eval="async"></script>
</body>
</html>
