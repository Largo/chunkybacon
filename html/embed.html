<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruby - Chunky Bacon</title>
  <meta name="robots" content="noindex">
  <!-- One runnable Chunky Bacon cell for other pages (an <iframe>, or
       embed.js upgrading <pre data-chunky>). The code is in the address's
       fragment (#code=<deflate-raw, base64url>&gems=..&lang=..&load=..), so
       it never reaches the server. Nothing of the course's page is here: no
       PicoRuby shell, no lessons.js, no storage.js, no offline worker - just
       the editor, and the course's kernel (main.rb on ruby.wasm), loaded when
       the cell scrolls into view or on the first Run.
       The server sends it with Content-Security-Policy: sandbox ... and
       frame-ancestors (nginx/default.conf, tools/dev_server.rb): it runs in
       an opaque origin, with none of the course's storage, though it is
       on the course's host. Without that header (self.origin is not
       "null") embed-frame.js runs nothing. -->
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="assets/codemirror.css">
  <link rel="stylesheet" href="assets/app.css">
  <link rel="stylesheet" href="embed.css">
  <link rel="icon" href="assets/chunky.svg">
  <script src="embed-ui.js"></script>
  <script src="embed-frame.js"></script>
  <!-- the editor downloads meanwhile; embed-frame.js runs it once the code
       is on screen as plain text, then the editor takes over -->
  <link rel="preload" href="assets/codemirror.js" as="script">
  <link rel="preload" href="assets/codemirror-ruby.js" as="script">
</head>
<body>
  <!-- the kernel's widget listeners hang on #lessonBody (main.rb) -->
  <article id="lessonBody">
    <div class="cell" id="cell">
      <pre class="embed-plain" id="cell-plain"></pre>
      <textarea id="cell-code-0" hidden></textarea>
      <div class="cell-toolbar">
        <span class="embed-status" id="embedStatus" role="status"></span>
        <span class="run-time" id="runTime"></span>
        <a class="embed-brand" id="embedBrand" href="./" target="_blank" rel="noopener">
          <img src="assets/chunky.svg" alt=""> Chunky Bacon
        </a>
        <button type="button" class="run-cell" id="runBtn" data-idx="0"></button>
      </div>
      <div class="cell-out" id="cell-out-0" style="display:none"></div>
    </div>
  </article>
  <!-- what a run did, for screen readers (embed-frame.js: announce) -->
  <p id="runStatus" class="sr-only" role="status" aria-live="polite"></p>
  <!-- the kernel: inert until embed-frame.js adds browser.script.iife.js -->
  <script type="text/ruby" src="main.rb" data-eval="async"></script>
</body>
</html>
