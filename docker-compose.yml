name: chunkybacon
services:
  chunkybacon:
    image: nginx:1.27-alpine
    container_name: chunkybacon
    restart: unless-stopped
    ports:
      - "8011:80"     # host:container
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx:/etc/nginx/conf.d:ro   # a folder: git replaces files, a file mount keeps the old one
      - gemcache:/var/cache/nginx
  # Optional (server/app.rb): permalinks like /de/methoden and room for
  # backend code. Started only with: docker compose --profile server up -d
  # nginx then needs to send the page's addresses to it (docs/HANDOVER.md §7a).
  server:
    profiles: ["server"]
    image: ruby:4.0
    container_name: chunkybacon-server
    restart: unless-stopped
    working_dir: /srv/chunkybacon/server
    command: sh -c "bundle install --quiet && exec bundle exec puma -b tcp://0.0.0.0:9292 config.ru"
    environment:
      RACK_ENV: production
      BUNDLE_WITHOUT: test
      BUNDLE_FROZEN: "true"   # use Gemfile.lock as it is: the checkout is mounted read-only
    volumes:
      - ./:/srv/chunkybacon:ro
      - serverbundle:/usr/local/bundle
    ports:
      - "127.0.0.1:8012:9292"
  # Builds Spinel for lesson 39 into html/assets/spinel/ (tools/build_spinel.mjs,
  # docs/HANDOVER.md §6l). Run by the deploy (tools/after_deploy.sh), never
  # started by `up`: docker compose --profile build run --rm spinel-build
  # It does nothing while the build there is the one tools/spinel.json pins.
  spinel-build:
    profiles: ["build"]
    image: node:22-alpine
    working_dir: /srv/chunkybacon
    command: node tools/build_spinel.mjs
    environment:
      SPINEL_JOBS: "${SPINEL_JOBS:-4}"   # clang workers: each one is a clang of its own in memory
    volumes:
      - ./:/srv/chunkybacon
volumes:
  gemcache:
  serverbundle:
