name: chunkybacon
services:
  chunkybacon:
    image: nginx:1.27-alpine
    container_name: chunkybacon
    restart: unless-stopped
    ports:
      - "8011:80"     # host:container
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - gemcache:/var/cache/nginx
volumes:
  gemcache:
