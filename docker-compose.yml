name: chunkybacon
services:
  chunkybacon:
    image: nginx:1.27-alpine
    container_name: chunkybacon
    restart: unless-stopped
    ports:
      - "8011:80"     # host:container
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx:/etc/nginx/conf.d:ro   # a folder: git replaces files, a file mount keeps the old one
      - gemcache:/var/cache/nginx
volumes:
  gemcache:
