# chunkybacon site + same-origin bridges to rubygems.org and ruby-lang.org
# for the in-browser gem installer and the HTTP lesson (no CORS needed).
#
# Safety properties: these are NOT open proxies - upstream hosts are
# hardcoded, only the path is forwarded, methods are restricted, requests
# are rate-limited per client IP, and responses are cached on disk (gems
# are immutable; pages expire). Never make the upstream host variable and
# never allowlist an upstream that serves untrusted HTML.
proxy_cache_path /var/cache/nginx/rubygems levels=1:2 keys_zone=rubygems:10m
                 max_size=2g inactive=60d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=proxylimit:10m rate=5r/s;

# The bridges serve the course's own pages and nothing else: a request
# passes only if its Referer is a page on the host it was sent to. The
# string "$http_referer|$host" is e.g.
#   "https://chunkybacon.idogawa.com/de/methoden|chunkybacon.idogawa.com";
# the pattern takes the Referer's host name (port and path left aside) and
# \1 wants the same name after the "|". Nothing is hard-coded, so it holds
# at the server's address today and at the domain later (as long as the
# reverse proxy in front passes the Host header on). No Referer, or one of
# another site: 0, and the bridge answers 403. A sandboxed page (the
# embed, embed.html) sends no Referer at all, so it gets gems from the
# cache only. A script outside a browser can send any Referer - the rate
# limit is for that; this stops other sites using the bridges through
# their visitors' browsers.
# To pin it to the domain once chunkybacon.idogawa.com is live, replace the
# pattern line below with this one:
#     "~*^https://chunkybacon\.idogawa\.com/" 1;
map "$http_referer|$host" $chunky_bridge_ok {
    default 0;
    "~*^https?://([^/:|]+)(:[0-9]+)?/[^|]*\|\1$" 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression. Text is gzipped on the fly - cheap at these sizes, and an
    # edited lessons.js or main.rb can never be shadowed by a stale .gz. The
    # 33 MB ruby+stdlib.wasm goes out as the ruby+stdlib.wasm.gz next to it
    # (10 MB, level 9 once, tools/compress_assets.rb) instead of being
    # compressed on every request. .gem and .woff2 files are compressed already.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/wasm image/svg+xml;

    # Every static file may be read from another origin. The embed
    # (embed.html, below) runs in an opaque origin (Origin: null), so its
    # fetches of main.rb, ruby+stdlib.wasm, the gem cache and the fonts are
    # cross-origin. "*", not "null": the files are public (and on GitHub),
    # nothing is sent with credentials, and "null" would be no narrower -
    # every sandboxed frame and data: page on any site is "null" as well.
    # A location with an add_header of its own does not inherit this one:
    # the app-code location repeats it, the bridges deliberately do not.
    add_header Access-Control-Allow-Origin "*";

    # The app's own code and data: revalidate on every load (a cheap 304 when
    # unchanged). Without a Cache-Control header browsers cache these
    # heuristically, so after a deploy a normal reload could run yesterday's
    # main.rb against today's lessons. The 33 MB ruby+stdlib.wasm, images and
    # cached .gem files keep ordinary caching. The proxy locations below are
    # ^~ so this regex cannot capture their .json paths.
    location ~* \.(html|rb|m?js|css|json)$ {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
        # mime.types knows no .rb (octet-stream, which gzip_types leaves
        # alone), nor .mjs (Pyodide's modules - a module script needs a
        # JavaScript type); a types block here replaces the whole map, so all
        types {
            text/html html;
            text/plain rb;
            text/javascript js mjs;
            text/css css;
            application/json json;
        }
        charset utf-8;
    }

    # One runnable cell for other pages (embed.html; README "Embedding a
    # cell"). Its code comes from the address - from whoever made the link -
    # so the page is sandboxed: an opaque origin with none of the course's
    # localStorage, IndexedDB, Cache Storage or service worker, although it
    # is served from the course's host. frame-ancestors: only
    # https://idogawa.com may put it in an iframe (a plain link to it still
    # opens it). The rest is hardening: it loads from and connects to its
    # own host only ('unsafe-eval': the js gem needs it while it boots).
    # An exact match, so the app-code regex above does not take it; it sets
    # what that location would, and needs no CORS header itself.
    location = /embed.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "sandbox allow-scripts allow-popups allow-popups-to-escape-sandbox allow-downloads; frame-ancestors https://idogawa.com; default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src blob:; form-action 'none'; base-uri 'none'" always;
        charset utf-8;
    }

    # The bridges below: only for the course's own pages ($chunky_bridge_ok,
    # above), and their answers may not be loaded by another site's page
    # (Cross-Origin-Resource-Policy). No CORS header, not even one from
    # upstream: they are same-origin.

    # same-origin bridge to the Ruby homepage for the HTTP lesson (GET only)
    location ^~ /proxy/ruby-lang/ {
        if ($chunky_bridge_ok = 0) { return 403; }
        limit_req zone=proxylimit burst=60 nodelay;
        limit_except GET HEAD { deny all; }

        resolver 127.0.0.11 ipv6=off valid=300s;
        set $rubylang_upstream "https://www.ruby-lang.org";
        rewrite ^/proxy/ruby-lang/(.*)$ /$1 break;
        proxy_pass $rubylang_upstream;
        proxy_set_header Host www.ruby-lang.org;
        proxy_ssl_server_name on;
        proxy_ssl_name www.ruby-lang.org;

        proxy_cache rubygems;
        proxy_cache_valid 200 6h;
        proxy_cache_valid any 10m;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cross-Origin-Resource-Policy same-origin always;
    }

    # rubygems bridge: only the two path shapes the gem installer uses
    # (gem metadata and .gem downloads); everything else on the host 403s.
    location ^~ /rubygems/api/v1/gems/ {
        if ($chunky_bridge_ok = 0) { return 403; }
        limit_req zone=proxylimit burst=60 nodelay;
        limit_except GET HEAD { deny all; }

        resolver 127.0.0.11 ipv6=off valid=300s;
        set $rubygems_upstream "https://rubygems.org";
        rewrite ^/rubygems/(.*)$ /$1 break;
        proxy_pass $rubygems_upstream;
        proxy_set_header Host rubygems.org;
        proxy_ssl_server_name on;
        proxy_ssl_name rubygems.org;

        proxy_cache rubygems;
        proxy_cache_valid 200 1d;
        proxy_cache_valid 404 1h;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cross-Origin-Resource-Policy same-origin always;
    }

    location ^~ /rubygems/gems/ {
        if ($chunky_bridge_ok = 0) { return 403; }
        limit_req zone=proxylimit burst=60 nodelay;
        limit_except GET HEAD { deny all; }

        resolver 127.0.0.11 ipv6=off valid=300s;
        set $rubygems_upstream "https://rubygems.org";
        rewrite ^/rubygems/(.*)$ /$1 break;
        proxy_pass $rubygems_upstream;
        proxy_set_header Host rubygems.org;
        proxy_ssl_server_name on;
        proxy_ssl_name rubygems.org;

        proxy_cache rubygems;
        proxy_cache_valid 200 60d;
        proxy_cache_valid 404 1h;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cross-Origin-Resource-Policy same-origin always;
    }

    location ^~ /rubygems/ {
        return 403;
    }
}
