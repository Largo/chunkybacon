# chunkybacon site + same-origin bridges to rubygems.org and ruby-lang.org
# for the in-browser gem installer and the HTTP lesson (no CORS needed).
#
# Safety properties: these are NOT open proxies - upstream hosts are
# hardcoded, only the path is forwarded, methods are restricted, requests
# are rate-limited per client IP, and responses are cached on disk (gems
# are immutable; pages expire). Never make the upstream host variable and
# never allowlist an upstream that serves untrusted HTML.
proxy_cache_path /var/cache/nginx/rubygems levels=1:2 keys_zone=rubygems:10m
                 max_size=2g inactive=60d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=proxylimit:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression. Text is gzipped on the fly - cheap at these sizes, and an
    # edited lessons.js or main.rb can never be shadowed by a stale .gz. The
    # 33 MB ruby+stdlib.wasm goes out as the ruby+stdlib.wasm.gz next to it
    # (10 MB, level 9 once, tools/compress_assets.rb) instead of being
    # compressed on every request. .gem and .woff2 files are compressed already.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/wasm image/svg+xml;

    # The app's own code and data: revalidate on every load (a cheap 304 when
    # unchanged). Without a Cache-Control header browsers cache these
    # heuristically, so after a deploy a normal reload could run yesterday's
    # main.rb against today's lessons. The 33 MB ruby+stdlib.wasm, images and
    # cached .gem files keep ordinary caching. The proxy locations below are
    # ^~ so this regex cannot capture their .json paths.
    location ~* \.(html|rb|m?js|css|json)$ {
        add_header Cache-Control "no-cache";
        # mime.types knows no .rb (octet-stream, which gzip_types leaves
        # alone), nor .mjs (Pyodide's modules - a module script needs a
        # JavaScript type); a types block here replaces the whole map, so all
        types {
            text/html html;
            text/plain rb;
            text/javascript js mjs;
            text/css css;
            application/json json;
        }
        charset utf-8;
    }

    # same-origin bridge to the Ruby homepage for the HTTP lesson (GET only)
    location ^~ /proxy/ruby-lang/ {
        limit_req zone=proxylimit burst=60 nodelay;
        limit_except GET HEAD { deny all; }

        resolver 127.0.0.11 ipv6=off valid=300s;
        set $rubylang_upstream "https://www.ruby-lang.org";
        rewrite ^/proxy/ruby-lang/(.*)$ /$1 break;
        proxy_pass $rubylang_upstream;
        proxy_set_header Host www.ruby-lang.org;
        proxy_ssl_server_name on;
        proxy_ssl_name www.ruby-lang.org;

        proxy_cache rubygems;
        proxy_cache_valid 200 6h;
        proxy_cache_valid any 10m;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # rubygems bridge: only the two path shapes the gem installer uses
    # (gem metadata and .gem downloads); everything else on the host 403s.
    location ^~ /rubygems/api/v1/gems/ {
        limit_req zone=proxylimit burst=60 nodelay;
        limit_except GET HEAD { deny all; }

        resolver 127.0.0.11 ipv6=off valid=300s;
        set $rubygems_upstream "https://rubygems.org";
        rewrite ^/rubygems/(.*)$ /$1 break;
        proxy_pass $rubygems_upstream;
        proxy_set_header Host rubygems.org;
        proxy_ssl_server_name on;
        proxy_ssl_name rubygems.org;

        proxy_cache rubygems;
        proxy_cache_valid 200 1d;
        proxy_cache_valid 404 1h;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location ^~ /rubygems/gems/ {
        limit_req zone=proxylimit burst=60 nodelay;
        limit_except GET HEAD { deny all; }

        resolver 127.0.0.11 ipv6=off valid=300s;
        set $rubygems_upstream "https://rubygems.org";
        rewrite ^/rubygems/(.*)$ /$1 break;
        proxy_pass $rubygems_upstream;
        proxy_set_header Host rubygems.org;
        proxy_ssl_server_name on;
        proxy_ssl_name rubygems.org;

        proxy_cache rubygems;
        proxy_cache_valid 200 60d;
        proxy_cache_valid 404 1h;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location ^~ /rubygems/ {
        return 403;
    }
}
