<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Zeitreise durch eine Zelle - Mock</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- the course's own fonts, straight from html/ (works from file:// too) -->
<link rel="stylesheet" href="../../html/assets/fonts/fonts.css">
<style>
  /* colours and faces from html/assets/app.css */
  :root {
    --paper: #ffffff; --karo: #e3eaf1; --ink: #1a1208; --ink-soft: #5f5247;
    --rule: #d4dbe3; --fox: #e8722a; --fox-light: #f39a60; --bacon: #c14a2e;
    --fat: #fdeee3; --highlight: #ffc9a1; --code-bg: #eef2f6;
    --ok: #2e7d32; --err: #b3261e; --focus: #2f6db5;
    --font-print: "Atkinson Hyperlegible Next", system-ui, sans-serif;
    --font-code: "Atkinson Hyperlegible Mono", ui-monospace, "Cascadia Code", monospace;
    --font-hand: "Shantell Sans", "Segoe Print", system-ui, sans-serif;
    --grid: 24px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; font-family: var(--font-print); color: var(--ink);
    background-color: var(--paper);
    background-image: linear-gradient(var(--karo) 1px, transparent 1px),
                      linear-gradient(90deg, var(--karo) 1px, transparent 1px);
    background-size: var(--grid) var(--grid);
  }
  h1 { font: 600 1.5rem/1.2 var(--font-hand); margin: 0 0 4px; }
  .mock-bar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; color: var(--ink-soft); font-size: .9rem; }
  .mock-bar select { font: inherit; padding: 2px 6px; }
  .mock-bar .langs button { font: inherit; border: 1px solid var(--rule); background: var(--paper); padding: 2px 8px; border-radius: 4px; cursor: pointer; }
  .mock-bar .langs button[aria-pressed="true"] { border-color: var(--ink); font-weight: 600; }

  /* the cell: a white worksheet, as in the course */
  .cell { max-width: 60rem; background: var(--paper); border: 2px solid var(--ink); border-radius: 6px; box-shadow: 3px 3px 0 var(--ink); }
  .cell-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--rule); }
  .cell-head .run { font: 600 .9rem var(--font-print); background: var(--fox); color: var(--ink); border: 1.5px solid var(--ink); border-radius: 4px; padding: 3px 10px; }
  .cell-head .step-toggle { font: 600 .9rem var(--font-print); background: var(--fat); border: 1.5px solid var(--ink); border-radius: 4px; padding: 3px 10px; }
  .cell-head .title { color: var(--ink-soft); font-size: .9rem; margin-left: auto; }

  .tt { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
  .tt-code { border-right: 1px solid var(--rule); padding: 8px 0; font: 15px/24px var(--font-code); }
  .ln { display: grid; grid-template-columns: 2.6em 2.2em 1fr; align-items: center; min-height: 24px; position: relative; }
  .ln .no { color: #9aa5b1; text-align: right; padding-right: 6px; }
  .ln .hits { color: var(--ink-soft); font: 600 11px var(--font-print); text-align: center; }
  .ln .hits span { background: var(--code-bg); border-radius: 8px; padding: 0 5px; }
  .ln pre { margin: 0; white-space: pre; overflow: hidden; padding-right: 8px; }
  .ln.ran pre { color: var(--ink); }
  .ln.not-yet pre { color: #8b939c; }
  .ln.now { background: var(--highlight); }
  .ln.now::before { content: "▶"; position: absolute; left: 2px; color: var(--bacon); font-size: 12px; }
  .ln.now.error { background: #f9d2cf; }
  .ln.now.error::before { content: "✖"; color: var(--err); }
  .ln.now.call { background: #dbe8f7; }
  .ln.now.return { background: #dcefdc; }

  .tt-side { padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .say { font: 1rem/1.35 var(--font-hand); background: var(--fat); border: 1.5px solid var(--ink); border-radius: 10px; padding: 8px 10px; position: relative; }
  .say.error { background: #fbe3e1; }
  .frames { display: flex; flex-direction: column; gap: 6px; }
  .frame { border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
  .frame.top { border-color: var(--ink); }
  .frame h3 { margin: 0; font: 600 .8rem var(--font-print); background: var(--code-bg); padding: 3px 8px; display: flex; gap: 6px; }
  .frame h3 .iter { margin-left: auto; color: var(--bacon); }
  .frame table { border-collapse: collapse; width: 100%; font: 14px/1.4 var(--font-code); }
  .frame td { padding: 2px 8px; border-top: 1px solid #edf0f3; vertical-align: top; }
  .frame td.n { width: 1%; white-space: nowrap; color: var(--ink-soft); }
  .frame td.v { word-break: break-all; }
  .frame tr.changed td.v { background: #fff2b8; }
  .frame tr.earlier td.n::after { content: " ⟲"; color: #9aa5b1; }
  .frame .empty { color: #9aa5b1; font: italic .8rem var(--font-print); padding: 3px 8px; }
  .out { font: 13px/1.4 var(--font-code); background: var(--code-bg); border-radius: 4px; padding: 6px 8px; min-height: 2.2em; white-space: pre-wrap; margin: 0; }
  .out-label { font: 600 .75rem var(--font-print); color: var(--ink-soft); margin-bottom: -6px; }

  .controls { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--rule); }
  .controls .btns { display: flex; gap: 4px; }
  .controls button { font: 600 15px var(--font-print); width: 34px; height: 30px; border: 1.5px solid var(--ink); border-radius: 4px; background: var(--paper); cursor: pointer; }
  .controls button:hover { background: var(--fat); }
  .controls button:disabled { opacity: .35; cursor: default; }
  .track { position: relative; }
  .track input { width: 100%; accent-color: var(--fox); margin: 0; }
  .ticks { display: flex; height: 8px; gap: 1px; margin-top: 2px; }
  .ticks i { flex: 1; background: var(--rule); border-radius: 1px; }
  .ticks i.call { background: #8fb3de; } .ticks i.return { background: #8cc48f; }
  .ticks i.error { background: var(--err); } .ticks i.end { background: var(--ink); }
  .ticks i.pass { box-shadow: -1px 0 0 var(--fox); }
  .ticks i.cur { background: var(--fox); }
  .count { font: 600 .85rem var(--font-print); color: var(--ink-soft); white-space: nowrap; min-width: 9em; text-align: right; }
  .note { padding: 6px 12px; font-size: .85rem; color: var(--ink-soft); border-top: 1px dashed var(--rule); }
  .note.warn { color: var(--bacon); }
  .legend { max-width: 60rem; color: var(--ink-soft); font-size: .8rem; margin-top: 10px; }
</style>
</head>
<body>
<h1 id="h">Zeitreise durch eine Zelle</h1>
<div class="mock-bar">
  <label>Beispiel <select id="sample"></select></label>
  <span class="langs" id="langs"></span>
  <span>Mock: Daten von step_recorder.rb (samples.js)</span>
</div>

<div class="cell" id="cell">
  <div class="cell-head">
    <span class="run">▶</span><span class="step-toggle" id="stepLabel">⏯ Schritt für Schritt</span>
    <span class="title" id="title"></span>
  </div>
  <div class="tt">
    <div class="tt-code" id="code"></div>
    <div class="tt-side">
      <div class="say" id="say"></div>
      <div class="frames" id="frames"></div>
      <div class="out-label" id="outLabel"></div>
      <pre class="out" id="out"></pre>
    </div>
  </div>
  <div class="controls">
    <div class="btns">
      <button id="first" title="">⏮</button><button id="prev" title="">◀</button>
    </div>
    <div class="track">
      <input type="range" id="slider" min="0" value="0" aria-label="">
      <div class="ticks" id="ticks" aria-hidden="true"></div>
    </div>
    <div class="btns">
      <button id="play" title="">⏵</button><button id="next" title="">▶</button><button id="last" title="">⏭</button>
      <span class="count" id="count"></span>
    </div>
  </div>
  <div class="note" id="note" hidden></div>
</div>
<p class="legend" id="legend"></p>

<script src="samples.js"></script>
<script>
// UI strings - in the course they would live in lessons.js "ui" (de/en/ja)
const T = {
  de: {
    h: 'Zeitreise durch eine Zelle', toggle: '⏯ Schritt für Schritt', sample: 'Beispiel',
    first: 'Zum Anfang', prev: 'Einen Schritt zurück', next: 'Einen Schritt vor', last: 'Zum Ende', play: 'Abspielen',
    step: (i, n) => `Schritt ${i} von ${n}`, slider: 'Schritt wählen', output: 'Ausgabe bis hier',
    line: (l, hit) => hit > 1 ? `Zeile ${l} ist dran - zum ${hit}. Mal.` : `Zeile ${l} ist dran.`,
    call: (name, args) => `Ruby springt in die Methode ${name}${args}.`,
    ret: (name, v) => `${name} ist fertig und gibt ${v} zurück.`,
    end: v => `Fertig! Das Ergebnis der Zelle: => ${v}`,
    error: (l, e) => `Hier geht es schief, in Zeile ${l}: ${e}`,
    pass: n => `Durchlauf ${n}`, main: 'Zelle', method: n => `Methode ${n}`, block: n => `Block: ${n}`,
    none: 'noch keine Variablen', more: n => `${n} weitere Aufrufe darunter`,
    truncated: n => `Nach ${n} Schritten habe ich aufgehört mitzuschreiben. Die Zelle lief trotzdem zu Ende.`,
    legend: '⟲ = Variable aus einer früheren Zelle (alle Zellen einer Lektion teilen sich ihre Variablen). Gelb = hat sich in diesem Schritt geändert. ×n = so oft lief die Zeile bis hier. Tasten: ← → Pos1 Ende.'
  },
  en: {
    h: 'Time travel through a cell', toggle: '⏯ Step by step', sample: 'Sample',
    first: 'To the start', prev: 'One step back', next: 'One step forward', last: 'To the end', play: 'Play',
    step: (i, n) => `Step ${i} of ${n}`, slider: 'Choose a step', output: 'Output so far',
    line: (l, hit) => hit > 1 ? `Line ${l} is next - for the ${ord(hit)} time.` : `Line ${l} is next.`,
    call: (name, args) => `Ruby jumps into the method ${name}${args}.`,
    ret: (name, v) => `${name} is done and returns ${v}.`,
    end: v => `Done! The cell's result: => ${v}`,
    error: (l, e) => `This is where it goes wrong, in line ${l}: ${e}`,
    pass: n => `pass ${n}`, main: 'cell', method: n => `method ${n}`, block: n => `block: ${n}`,
    none: 'no variables yet', more: n => `${n} more calls below`,
    truncated: n => `I stopped taking notes after ${n} steps. The cell still ran to the end.`,
    legend: '⟲ = a variable from an earlier cell (all cells of a lesson share their variables). Yellow = changed in this step. ×n = how often the line ran so far. Keys: ← → Home End.'
  },
  ja: {
    h: 'セルのタイムトラベル', toggle: '⏯ 1ステップずつ', sample: '例',
    first: '最初へ', prev: '1つ戻る', next: '1つ進む', last: '最後へ', play: '再生',
    step: (i, n) => `ステップ ${i} / ${n}`, slider: 'ステップを選ぶ', output: 'ここまでの出力',
    line: (l, hit) => hit > 1 ? `次は ${l} 行目 (${hit} 回目) です。` : `次は ${l} 行目です。`,
    call: (name, args) => `メソッド ${name}${args} の中へ入ります。`,
    ret: (name, v) => `${name} が終わり、${v} を返します。`,
    end: v => `おしまい！セルの結果: => ${v}`,
    error: (l, e) => `${l} 行目でうまくいきません: ${e}`,
    pass: n => `${n} 回目`, main: 'セル', method: n => `メソッド ${n}`, block: n => `ブロック: ${n}`,
    none: 'まだ変数はありません', more: n => `下にあと ${n} 個の呼び出し`,
    truncated: n => `${n} ステップで記録をやめました。セルは最後まで実行されています。`,
    legend: '⟲ = 前のセルの変数 (レッスンのセルはすべて変数を共有します)。黄色 = このステップで変わった値。×n = ここまでにその行が実行された回数。キー: ← → Home End'
  }
};
function ord(n) { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

const params = new URLSearchParams(location.search);
let lang = params.get('lang') || 'de';
let sample = null, trace = null, step = 0, timer = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// output offsets are bytes (Ruby's bytesize); JS strings are UTF-16
const enc = new TextEncoder(), dec = new TextDecoder();
function outputUpTo(bytes) { return dec.decode(enc.encode(trace.output).slice(0, bytes)); }

function framesOf(s) { return (s.f || []).map(i => trace.frames[i]); }
function varMap(frame) { const m = {}; (frame.vars || []).forEach(([n, v]) => { m[n] = v; }); return m; }

function setSample(id) {
  sample = window.SAMPLES.find(s => s.id === id) || window.SAMPLES[0];
  trace = sample.trace;
  $('sample').value = sample.id;
  $('title').textContent = sample.title;
  $('slider').max = trace.steps.length - 1;
  const t = T[lang];
  $('ticks').innerHTML = trace.steps.map((s, i) => {
    const fr = framesOf(s), top = fr[fr.length - 1];
    const prevTop = i > 0 ? framesOf(trace.steps[i - 1]).slice(-1)[0] : null;
    const newPass = top && top.iter && (!prevTop || prevTop.iter !== top.iter || prevTop.name !== top.name);
    return `<i class="${s.event}${newPass ? ' pass' : ''}" data-i="${i}"></i>`;
  }).join('');
  const note = $('note');
  note.hidden = !trace.truncated;
  note.className = 'note warn';
  note.textContent = trace.truncated ? t.truncated(trace.steps.length - 1) : '';
  go(Math.min(+(params.get('step') || 0), trace.steps.length - 1));
}

function go(i) {
  step = Math.max(0, Math.min(i, trace.steps.length - 1));
  render();
}

function render() {
  const t = T[lang];
  const s = trace.steps[step];
  const prev = step > 0 ? trace.steps[step - 1] : null;
  const lines = trace.code.replace(/\n$/, '').split('\n');

  // hits per line up to this step (line events only), and which lines ran
  const hits = {};
  for (let k = 0; k <= step; k++) {
    const st = trace.steps[k];
    if (st.event === 'line') hits[st.line] = (hits[st.line] || 0) + 1;
  }
  const cls = s.event === 'error' ? 'error' : s.event === 'call' ? 'call' : s.event === 'return' ? 'return' : '';
  $('code').innerHTML = lines.map((text, k) => {
    const no = k + 1, h = hits[no] || 0;
    const now = s.line === no;
    return `<div class="ln ${now ? 'now ' + cls : ''} ${h ? 'ran' : 'not-yet'}">` +
      `<span class="no">${no}</span><span class="hits">${h > 1 ? `<span>×${h}</span>` : ''}</span>` +
      `<pre>${esc(text) || ' '}</pre></div>`;
  }).join('');

  // what Chunky says about this step
  const fr = framesOf(s), top = fr[fr.length - 1];
  let say;
  if (s.event === 'line') say = t.line(s.line, s.hit);
  else if (s.event === 'call') {
    const args = '(' + (top.vars || []).map(([, v]) => v).join(', ') + ')';
    say = t.call(top.name, args);
  } else if (s.event === 'return') say = t.ret(top.name, s.value);
  else if (s.event === 'error') say = t.error(s.line, s.value);
  else say = t.end(s.value);
  $('say').textContent = say;
  $('say').className = 'say' + (s.event === 'error' ? ' error' : '');

  // the frames, outermost first; changed values against the previous step
  const prevFrames = prev ? framesOf(prev) : [];
  $('frames').innerHTML = fr.map((f, k) => {
    if (f.kind === 'more') return `<div class="frame"><div class="empty">${esc(t.more(f.name.replace('… ', '')))}</div></div>`;
    const before = prevFrames[k] && prevFrames[k].name === f.name && prevFrames[k].iter === f.iter ? varMap(prevFrames[k]) : null;
    const head = f.kind === 'main' ? t.main : f.kind === 'method' ? t.method(f.name) : t.block(f.name);
    const rows = (f.vars || []).map(([n, v, earlier]) => {
      const changed = prev && (before ? before[n] !== v : f.kind !== 'main');
      return `<tr class="${changed ? 'changed' : ''} ${earlier ? 'earlier' : ''}"><td class="n">${esc(n)}</td><td class="v">${esc(v)}</td></tr>`;
    }).join('');
    return `<div class="frame ${k === fr.length - 1 ? 'top' : ''}"><h3><span>${esc(head)}</span>` +
      `${f.iter ? `<span class="iter">${esc(t.pass(f.iter))}</span>` : ''}</h3>` +
      (rows ? `<table>${rows}</table>` : `<div class="empty">${esc(t.none)}</div>`) + '</div>';
  }).join('');

  $('outLabel').textContent = t.output;
  $('out').textContent = outputUpTo(s.out || 0);
  $('slider').value = step;
  $('count').textContent = t.step(step + 1, trace.steps.length);
  document.querySelectorAll('#ticks i').forEach((el, k) => el.classList.toggle('cur', k === step));
  $('first').disabled = $('prev').disabled = step === 0;
  $('next').disabled = $('last').disabled = step === trace.steps.length - 1;
}

function setLang(l) {
  lang = l;
  document.documentElement.lang = l;
  const t = T[l];
  $('h').textContent = t.h; $('stepLabel').textContent = t.toggle;
  for (const k of ['first', 'prev', 'next', 'last', 'play']) $(k).title = t[k];
  $('slider').setAttribute('aria-label', t.slider);
  $('legend').textContent = t.legend;
  document.querySelectorAll('#langs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === l));
  if (trace) setSample(sample.id);
}

function play() {
  if (timer) { clearInterval(timer); timer = null; $('play').textContent = '⏵'; return; }
  if (step >= trace.steps.length - 1) go(0);
  $('play').textContent = '⏸';
  timer = setInterval(() => { if (step >= trace.steps.length - 1) play(); else go(step + 1); }, 600);
}

$('sample').innerHTML = window.SAMPLES.map(s => `<option value="${s.id}">${esc(s.title)}</option>`).join('');
$('langs').innerHTML = ['de', 'en', 'ja'].map(l => `<button data-l="${l}">${l}</button>`).join('');
$('langs').addEventListener('click', e => { if (e.target.dataset.l) setLang(e.target.dataset.l); });
$('sample').addEventListener('change', e => setSample(e.target.value));
$('slider').addEventListener('input', e => go(+e.target.value));
$('ticks').addEventListener('click', e => { if (e.target.dataset.i) go(+e.target.dataset.i); });
$('first').onclick = () => go(0); $('prev').onclick = () => go(step - 1);
$('next').onclick = () => go(step + 1); $('last').onclick = () => go(trace.steps.length - 1);
$('play').onclick = play;
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight') go(step + 1);
  else if (e.key === 'ArrowLeft') go(step - 1);
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(trace.steps.length - 1);
  else return;
  e.preventDefault();
});
setLang(lang);
setSample(params.get('sample') || window.SAMPLES[0].id);
</script>
</body>
</html>
