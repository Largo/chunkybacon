<!doctype html>
<meta charset="utf-8">
<title>Turtle graphics with Chunky - examples</title>
<style>
  body { font-family: sans-serif; background: #f6efe3; margin: 1rem; }
  figure { display: inline-block; margin: 0.5rem; vertical-align: top; }

  figcaption { font-size: 0.85rem; color: #555; }
</style>

<figure><img src="examples/spiral.svg"><figcaption>spiral</figcaption></figure>
