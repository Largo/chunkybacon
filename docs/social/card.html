<!DOCTYPE html>
<!-- Social card. Screenshot the page at its exact size (tools/render_social_cards.mjs):
       card.html                 1600x900 (16:9) -> twitter-card.png  (X, Bluesky, Mastodon, README)
       card.html?format=github   1600x800 (2:1)  -> github-social.png (GitHub social preview, og:image)
     The site in the 2 CV look (docs/HANDOVER.md §10b), the tokens copied from
     html/assets/app.css: the course's name on the pale page beside a
     notebook cell whose answer is that name, and on one big Infra Red field
     _why's two foxes shouting "Chunky bacon!!" over the footer's tartan
     strip, under the dark cap with who made it. The foxes are
     html/assets/why-foxes/chunky-bacon.svg, put inline and held still (both
     balloons out, as under prefers-reduced-motion): by why the lucky stiff,
     from why's (poignant) guide to Ruby, CC BY-SA 2.5 - the card credits
     them, keep that line. No Citroen marks.
     ?lessons=N fills in the lesson count. The page is laid out on a
     1200-unit stage scaled to 1600 pixels; it needs a server (file:// blocks
     the fonts and the fetch), and sets html.ready once the foxes are in. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chunky Bacon social card</title>
<script>
  if (new URLSearchParams(location.search).get("format") === "github") document.documentElement.classList.add("github");
</script>
<link rel="stylesheet" href="/html/assets/fonts/fonts.css">
<style>
  :root {
    /* from html/assets/app.css */
    --infra: #ee3f24;       /* big fields only, never text */
    --glow: #ff7131;
    --cap: #1e2229;
    --mustard: #e2b034;
    --clip: #e4e943;        /* tiny accents on dark only */
    --cap-text: #d3ccb9;
    --bakelite: #ede5d0;
    --paper: #f5f1e8;
    --sheet: #fbf9f4;
    --ink: #1e2229;
    --ink-soft: #4e5560;
    --bacon: #bd2d00;
    --code-bg: #ece6d8;
    --ok: #276d2b;
    --font-print: "Atkinson Hyperlegible Next", sans-serif;
    --font-code: "Atkinson Hyperlegible Mono", monospace;
    --font-display: "Outfit", sans-serif;

    /* the stage: 1200 units wide, scaled to 1600 pixels */
    --stage-h: 675px;
    --word-top: 34px;  --word-size: 140px;
    --tag-top: 298px;  --tag-size: 30px;
    --cell-top: 398px;
    --band-top: 583px;  /* the tartan; the cap below it */
  }
  html.github {
    --stage-h: 600px;
    --word-top: 22px;  --word-size: 120px;
    --tag-top: 250px;  --tag-size: 28px;
    --cell-top: 336px;
    --band-top: 514px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 900px; overflow: hidden; background: var(--paper); }
  html.github, html.github body { height: 800px; }

  .stage {
    position: relative;
    width: 1200px;
    height: var(--stage-h);
    transform: scale(1.3333333);
    transform-origin: 0 0;
    color: var(--ink);
    font-family: var(--font-print);
    background: var(--paper);
    overflow: hidden;
  }

  .wordmark {
    position: absolute;
    left: 60px;
    top: var(--word-top);
    font-family: var(--font-display);
    font-weight: 800;
    font-size: var(--word-size);
    line-height: 0.9;
    letter-spacing: -0.035em;
  }

  .tagline {
    position: absolute;
    left: 64px;
    top: var(--tag-top);
    font-size: var(--tag-size);
    line-height: 1.25;
    font-weight: 700;
  }
  .tagline .sub { display: block; color: var(--ink-soft); font-weight: 500; }

  /* a notebook cell as the site draws it: the code on the dark cap, the
     toolbar with ⚡ Live and the one deep-red ▶ Run, and the answer below */
  .cell {
    position: absolute;
    left: 64px;
    top: var(--cell-top);
    width: 604px;
    border: 2px solid var(--ink);
    background: var(--sheet);
  }
  .code {
    display: flex;
    font-family: var(--font-code);
    font-size: 18px;
    line-height: 1.6;
    padding: 8px 0;
    color: var(--bakelite);
    background: var(--cap);
  }
  .gutter {
    color: #8c9095;
    padding: 0 10px 0 12px;
    border-right: 1px solid #3a404a;
  }
  .line { padding: 0 12px; white-space: pre; }
  .s { color: var(--mustard); }
  .y { color: #c9a7f0; }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 8px 7px 14px;
    border-top: 2px solid var(--ink);
  }
  .time { margin-right: auto; font-size: 14px; color: var(--ink-soft); }
  .live {
    font-size: 14px;
    padding: 4px 11px;
    border-radius: 999px;
    color: var(--clip);
    background: var(--cap);
  }
  .run {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 16px;
    line-height: 1.25;
    padding: 5px 16px;
    border-radius: 999px;
    border: 2px solid var(--ink);
    box-shadow: 0 2px 0 var(--ink);
    background: var(--bacon);
    color: #fff;
  }
  .out {
    padding: 7px 14px;
    border-top: 1px solid #d8d1c1;
    background: var(--code-bg);
    font-family: var(--font-code);
    font-size: 17px;
    color: var(--ok);
  }

  /* the one warm field, the foxes standing on the tartan at its foot */
  .field {
    position: absolute;
    left: 700px;
    right: 0;
    top: 0;
    height: var(--band-top);
    background: var(--infra);
    border-left: 2px solid var(--ink);
  }
  .foxes svg {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 500px;
    height: auto;
    display: block;
  }
  .foxes svg * { animation: none !important; }

  /* the site's footer: a strip of the seats' tartan, then the dark cap */
  .band {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--band-top);
    bottom: 0;
    padding-top: 24px;
    background: var(--cap);
    color: var(--cap-text);
  }
  .band::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 24px;
    background-color: var(--mustard);
    background-image:
      repeating-linear-gradient(0deg, transparent 0 11px, rgba(255, 250, 235, 0.6) 11px 12.5px, transparent 12.5px 17px, rgba(153, 140, 96, 0.5) 17px 23px, transparent 23px 34px),
      repeating-linear-gradient(90deg, transparent 0 11px, rgba(255, 250, 235, 0.6) 11px 12.5px, transparent 12.5px 17px, rgba(153, 140, 96, 0.5) 17px 23px, transparent 23px 34px);
    border-top: 2px solid var(--ink);
  }
  .band-row {
    height: 100%;
    display: flex;
    align-items: center;
    padding: 0 26px 0 64px;
    gap: 13px;
  }
  .band img {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 2px solid #adb0b3;
    object-fit: cover;
  }
  .band .name { font-weight: 700; font-size: 17px; line-height: 1.2; color: var(--bakelite); }
  .band .handle { font-weight: 500; color: var(--cap-text); margin-left: 4px; }
  .band .repo { font-family: var(--font-code); font-size: 14px; }
  .band .credit { margin-left: auto; font-size: 13px; text-align: right; line-height: 1.3; }
</style>
</head>
<body>
<div class="stage">
  <div class="wordmark">Chunky<br>Bacon</div>

  <p class="tagline">Learn Ruby right in your browser.<span class="sub"><span id="lessons">41</span> lessons, nothing to install.</span></p>

  <div class="cell">
    <div class="code"><span class="gutter">1</span><span class="line"><span class="s">"chunky bacon"</span>.split.map(<span class="y">&amp;:capitalize</span>).join(<span class="s">" "</span>)</span></div>
    <div class="toolbar"><span class="time">&lt; 0.1 s</span><span class="live">⚡ Live</span><span class="run">▶ Run</span></div>
    <div class="out">=&gt; "Chunky Bacon"</div>
  </div>

  <div class="field"><div class="foxes" id="foxes"></div></div>

  <div class="band"><div class="band-row">
    <img src="avatar.jpg" alt="">
    <div><div class="name">Andi Idogawa<span class="handle">@largo</span></div><div class="repo">github.com/Largo/chunkybacon</div></div>
    <div class="credit">Foxes by why the lucky stiff, from<br>why's (poignant) guide to Ruby · CC BY-SA 2.5</div>
  </div></div>
</div>
<script>
  var n = new URLSearchParams(location.search).get("lessons");
  if (n) document.getElementById("lessons").textContent = n;
  fetch("/html/assets/why-foxes/chunky-bacon.svg")
    .then(function (r) { return r.text(); })
    .then(function (svg) {
      document.getElementById("foxes").innerHTML = svg;
      document.documentElement.classList.add("ready");
    });
</script>
</body>
</html>
